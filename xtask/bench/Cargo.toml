[package]
name = "xtask_bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
xtask = { path = '../', version = "0.0" }
tuna_js_syntax = { path = "../../crates/tuna_js_syntax" }
tuna_console = { path = "../../crates/tuna_console" }
tuna_js_parser = { path = "../../crates/tuna_js_parser" }
tuna_json_formatter = { path = "../../crates/tuna_json_formatter" }
tuna_json_parser = { path = "../../crates/tuna_json_parser" }
tuna_json_syntax = { path = "../../crates/tuna_json_syntax" }
tuna_parser = { path = "../../crates/tuna_parser" }
tuna_diagnostics = { path = "../../crates/tuna_diagnostics" }
tuna_formatter = { path = "../../crates/tuna_formatter" }
tuna_js_formatter = { path = "../../crates/tuna_js_formatter" }
tuna_analyze = { path = "../../crates/tuna_analyze" }
tuna_js_analyze = { path = "../../crates/tuna_js_analyze" }
tuna_rowan = { path = "../../crates/tuna_rowan" }


pico-args = { version = "0.5.0", features = ["eq-separator"] }
timing = "0.2.3"
criterion = "0.4.0"
regex = "1.5.5"
ureq = "2.4.0"
url = "2.2.2"
itertools = "0.10.3"
ansi_rgb = "0.2.0"

countme = { workspace = true }

# dhat-on
dhat = { version = "0.3.0", optional = true }
humansize = { version = "2.1.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = "0.1.29"

[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.5.0"

[features]
dhat-heap = ["dhat", "humansize"]
count = ["countme/print_at_exit"]
