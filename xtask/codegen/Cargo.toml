[package]
name = "xtask_codegen"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
xtask = { path = '../', version = "0.0" }
anyhow = "1.0.52"
pico-args = { version = "0.5.0", features = ["eq-separator"] }
quote = "1.0.14"
proc-macro2 = { version = "1.0.63", features = ["span-locations"] }
ungrammar = "1.14.9"
walkdir = "2.3.2"
ureq = "2.4.0"
git2 = { version = "0.17.1", default-features = false }
filetime = "0.2.15"
case = "1.0.0"
pulldown-cmark = { version = "0.9", default-features = false, optional = true }
fs_extra = "1.3.0"

tuna_rowan = { path = "../../crates/tuna_rowan", optional = true }
tuna_cli = { workspace = true, optional = true }
tuna_analyze = { path = "../../crates/tuna_analyze", optional = true }
tuna_js_analyze = { path = "../../crates/tuna_js_analyze", optional = true }
tuna_json_analyze = { workspace = true, optional = true }
tuna_js_syntax = { path = "../../crates/tuna_js_syntax", optional = true }
tuna_json_syntax = { workspace = true, optional = true }
tuna_js_factory = { path = "../../crates/tuna_js_factory", optional = true }
tuna_js_formatter = { path = "../../crates/tuna_js_formatter", optional = true }
tuna_json_formatter = { path = "../../crates/tuna_json_formatter", optional = true }
tuna_json_parser = { path = "../../crates/tuna_json_parser", optional = true }
tuna_diagnostics = { path = "../../crates/tuna_diagnostics", optional = true }
tuna_aria = { path = "../../crates/tuna_aria", optional = true }
tuna_service = { path = "../../crates/tuna_service", features = [
	"schema",
], optional = true }
schemars = { version = "0.8.10", optional = true }
serde_json = { version = "1.0.74", optional = true }

[features]
configuration = [
  "tuna_analyze",
  "tuna_js_analyze",
  "tuna_js_syntax",
  "tuna_json_analyze",
  "tuna_json_syntax",
  "pulldown-cmark",
]
website = ["tuna_service", "tuna_cli/docgen"]
schema = [
  "schemars",
  "serde_json",
  "tuna_rowan",
  "tuna_service",
  "tuna_js_syntax",
  "tuna_js_factory",
  "tuna_js_formatter",
  "tuna_json_formatter",
  "tuna_json_parser",
  "tuna_diagnostics",
]
