[package]
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
name                 = "tuna_cli"
repository.workspace = true
version              = "0.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "rome"
path = "src/main.rs"

[dependencies]
anyhow              = "1.0.52"
bpaf                = { workspace = true }
crossbeam           = "0.8.1"
dashmap             = { workspace = true }
hdrhistogram        = { version = "7.5.0", default-features = false }
indexmap            = { workspace = true }
lazy_static         = { workspace = true }
rayon               = "1.5.1"
tuna_console        = { workspace = true }
tuna_deserialize    = { workspace = true }
tuna_diagnostics    = { workspace = true }
tuna_flags          = { workspace = true }
tuna_formatter      = { workspace = true }
tuna_fs             = { workspace = true }
tuna_json_formatter = { workspace = true }
tuna_json_parser    = { workspace = true }
tuna_json_syntax    = { workspace = true }
tuna_lsp            = { workspace = true }
tuna_migrate        = { workspace = true }
tuna_rowan          = { workspace = true }
tuna_service        = { workspace = true }
tuna_text_edit      = { workspace = true }
tuna_text_size      = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_json          = { workspace = true }
tokio               = { workspace = true, features = ["io-std", "io-util", "net", "time", "rt", "sync", "rt-multi-thread", "macros"] }
tracing             = { workspace = true }
tracing-appender    = "0.2"
tracing-subscriber  = { version = "0.3.16", features = ["env-filter"] }
tracing-tree        = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc  = "0.2.127"
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.29"

[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.5.0"

[dev-dependencies]
insta               = { workspace = true }
tuna_js_formatter   = { workspace = true }
tuna_json_formatter = { workspace = true }
tuna_json_parser    = { workspace = true }
tokio               = { workspace = true, features = ["io-util"] }

[features]
docgen = ["bpaf/docgen"]
