[package]
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
name                 = "tuna_lsp"
repository.workspace = true
version              = "0.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow            = "1.0.52"
futures           = "0.3"
indexmap          = { workspace = true }
tuna_analyze      = { workspace = true }
tuna_console      = { workspace = true }
tuna_diagnostics  = { workspace = true }
tuna_formatter    = { workspace = true }
tuna_fs           = { workspace = true }
tuna_js_formatter = { workspace = true }
tuna_rowan        = { workspace = true }
tuna_service      = { workspace = true }
tuna_text_edit    = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
tokio             = { workspace = true, features = ["rt", "io-std"] }
tower-lsp         = { version = "0.19.0" }
tracing           = { workspace = true, features = ["attributes"] }

[dev-dependencies]
proptest = "1.0.0"
tokio    = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tower    = { version = "0.4.12", features = ["timeout"] }
