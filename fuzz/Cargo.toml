[package]
name = "tuna_fuzz"
version = "0.0.0"
authors = ["Addison Crump <research@addisoncrump.info>"]
publish = false
edition = "2021"

[features]
default = ["libfuzzer"]
full-idempotency = []
libfuzzer = ["libfuzzer-sys/link_libfuzzer"]
tuna_all = []

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.3.0", features = ["derive"] }
libfuzzer-sys = { git = "https://github.com/rust-fuzz/libfuzzer", default-features = false }
tuna_analyze = { path = "../crates/tuna_analyze" }
tuna_diagnostics = { path = "../crates/tuna_diagnostics" }
tuna_formatter = { path = "../crates/tuna_formatter" }
tuna_js_analyze = { path = "../crates/tuna_js_analyze" }
tuna_js_formatter = { path = "../crates/tuna_js_formatter" }
tuna_js_parser = { path = "../crates/tuna_js_parser" }
tuna_js_syntax = { path = "../crates/tuna_js_syntax" }
tuna_json_formatter = { path = "../crates/tuna_json_formatter" }
tuna_json_parser = { path = "../crates/tuna_json_parser" }
tuna_json_syntax = { path = "../crates/tuna_json_syntax" }
tuna_service = { path = "../crates/tuna_service" }
similar = { version = "2.2.1" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "tuna_parse_all"
path = "fuzz_targets/tuna_parse_all.rs"
required-features = ["tuna_all"]

[[bin]]
name = "tuna_parse_d_ts"
path = "fuzz_targets/tuna_parse_d_ts.rs"

[[bin]]
name = "tuna_parse_json"
path = "fuzz_targets/tuna_parse_json.rs"

[[bin]]
name = "tuna_parse_module"
path = "fuzz_targets/tuna_parse_module.rs"

[[bin]]
name = "tuna_parse_script"
path = "fuzz_targets/tuna_parse_script.rs"

[[bin]]
name = "tuna_parse_jsx"
path = "fuzz_targets/tuna_parse_jsx.rs"

[[bin]]
name = "tuna_parse_tsx"
path = "fuzz_targets/tuna_parse_tsx.rs"

[[bin]]
name = "tuna_parse_typescript"
path = "fuzz_targets/tuna_parse_typescript.rs"

[[bin]]
name = "tuna_format_all"
path = "fuzz_targets/tuna_format_all.rs"
required-features = ["tuna_all"]

[[bin]]
name = "tuna_format_d_ts"
path = "fuzz_targets/tuna_format_d_ts.rs"

[[bin]]
name = "tuna_format_json"
path = "fuzz_targets/tuna_format_json.rs"

[[bin]]
name = "tuna_format_module"
path = "fuzz_targets/tuna_format_module.rs"

[[bin]]
name = "tuna_format_script"
path = "fuzz_targets/tuna_format_script.rs"

[[bin]]
name = "tuna_format_jsx"
path = "fuzz_targets/tuna_format_jsx.rs"

[[bin]]
name = "tuna_format_tsx"
path = "fuzz_targets/tuna_format_tsx.rs"

[[bin]]
name = "tuna_format_typescript"
path = "fuzz_targets/tuna_format_typescript.rs"

# enabling debug seems to cause a massive use of RAM (>12GB)
[profile.release]
opt-level = 3
#debug = true
debug = false

[profile.dev]
opt-level = 3
#debug = true
debug = false

[profile.test]
opt-level = 3
#debug = true
debug = false
