[workspace]
# Use the newer version of the cargo resolver
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
members = [
  "crates/*",
  "xtask/bench",
  "xtask/codegen",
  "xtask/coverage",
  "xtask/lintdoc",
  "xtask/libs_bench",
  "xtask/contributors",
]
resolver = "2"

[workspace.package]
authors    = ["Tunahan Coşgun <tunahan@tunasoft.tech>"]
edition    = "2021"
homepage   = "https://tunasoft.tech"
license    = "MIT"
repository = "https://github.com/tunahan/tunatools"

[profile.release-with-debug]
debug    = true
inherits = "release"

[workspace.dependencies]
# Internal crates
tuna_analyze                = { path = "./crates/tuna_analyze" }
tuna_aria                   = { path = "./crates/tuna_aria" }
tuna_aria_metadata          = { path = "./crates/tuna_aria_metadata" }
tuna_cli                    = { path = "./crates/tuna_cli" }
tuna_console                = { version = "0.0.1", path = "./crates/tuna_console" }
tuna_control_flow           = { path = "./crates/tuna_control_flow" }
tuna_css_factory            = { path = "./crates/tuna_css_factory" }
tuna_css_parser             = { path = "./crates/tuna_css_parser" }
tuna_css_syntax             = { path = "./crates/tuna_css_syntax" }
tuna_deserialize            = { version = "0.0.0", path = "./crates/tuna_deserialize" }
tuna_diagnostics            = { version = "0.0.1", path = "./crates/tuna_diagnostics" }
tuna_diagnostics_categories = { version = "0.0.1", path = "./crates/tuna_diagnostics_categories" }
tuna_diagnostics_macros     = { version = "0.0.1", path = "./crates/tuna_diagnostics_macros" }
tuna_flags                  = { path = "./crates/tuna_flags" }
tuna_formatter              = { version = "0.0.1", path = "./crates/tuna_formatter" }
tuna_formatter_test         = { path = "./crates/tuna_formatter_test" }
tuna_fs                     = { path = "./crates/tuna_fs" }
tuna_js_analyze             = { path = "./crates/tuna_js_analyze" }
tuna_js_factory             = { version = "0.0.2", path = "./crates/tuna_js_factory" }
tuna_js_formatter           = { path = "./crates/tuna_js_formatter" }
tuna_js_parser              = { path = "./crates/tuna_js_parser" }
tuna_js_semantic            = { path = "./crates/tuna_js_semantic" }
tuna_js_syntax              = { version = "0.0.2", path = "./crates/tuna_js_syntax" }
tuna_js_unicode_table       = { version = "0.0.1", path = "./crates/tuna_js_unicode_table" }
tuna_json_analyze           = { path = "./crates/tuna_json_analyze" }
tuna_json_factory           = { version = "0.0.1", path = "./crates/tuna_json_factory" }
tuna_json_formatter         = { path = "./crates/tuna_json_formatter" }
tuna_json_parser            = { path = "./crates/tuna_json_parser" }
tuna_json_syntax            = { version = "0.0.1", path = "./crates/tuna_json_syntax" }
tuna_lsp                    = { path = "./crates/tuna_lsp" }
tuna_markup                 = { version = "0.0.1", path = "./crates/tuna_markup" }
tuna_migrate                = { path = "./crates/tuna_migrate" }
tuna_parser                 = { version = "0.0.1", path = "./crates/tuna_parser" }
tuna_rowan                  = { version = "0.0.1", path = "./crates/tuna_rowan" }
tuna_service                = { path = "./crates/tuna_service" }
tuna_suppression            = { version = "0.0.1", path = "./crates/tuna_suppression" }
tuna_test_utils             = { path = "./crates/tuna_test_utils" }
tuna_text_edit              = { version = "0.0.1", path = "./crates/tuna_text_edit" }
tuna_text_size              = { version = "0.0.1", path = "./crates/tuna_text_size" }
tests_macros                = { path = "./crates/tests_macros" }

# Crates needed in the workspace
bitflags          = "2.3.1"
bpaf              = { version = "0.9.2", features = ["derive"] }
countme           = "3.0.1"
dashmap           = "5.4.0"
indexmap          = "1.9.3"
insta             = "1.29.0"
lazy_static       = "1.4.0"
quickcheck        = "1.0.3"
quickcheck_macros = "1.0.0"
quote             = { version = "1.0.28" }
rustc-hash        = "1.1.0"
schemars          = { version = "0.8.12" }
serde             = { version = "1.0.163", features = ["derive"], default-features = false }
serde_json        = "1.0.96"
smallvec          = { version = "1.10.0", features = ["union", "const_new"] }
tracing           = { version = "0.1.37", default-features = false, features = ["std"] }
# pinning to version 1.18 to avoid multiple versions of windows-sys as dependency
tokio = { version = "~1.18.5" }


[profile.dev.package.tuna_wasm]
debug     = true
opt-level = "s"

[profile.test.package.tuna_wasm]
debug     = true
opt-level = "s"

[profile.release.package.tuna_wasm]
debug     = false
opt-level = 3
